name: Deploy Sculpin Site to GitHub Pages

on:
  push:
    branches:
      - main  # or 'master', adjust to your default branch
  workflow_dispatch:  # allow manual triggers

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'  # adjust to your PHP version
          extensions: mbstring, intl, xml
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build Sculpin site
        run: |
          php vendor/bin/sculpin generate --env=prod
          touch output_prod/.nojekyll  # prevent GitHub Pages from running Jekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./output_prod

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
